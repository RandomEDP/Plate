# The Xcode project is generated from this file on GitHub's Macs (XcodeGen), so nothing Xcode-specific is committed.
name: Plate
options:
  bundleIdPrefix: com.randomedp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  PlateCore:
    path: Packages/PlateCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Plate:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PlateCore
      - target: PlateShare
    entitlements:
      path: App/Plate.entitlements
      properties:
        com.apple.security.application-groups: [group.com.randomedp.plate.share]
        com.apple.developer.homekit: true
        com.apple.developer.weatherkit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Plate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.food-and-drink
        UILaunchScreen:
          UIColorName: AccentColor
        # iPhone stays portrait. The iPad (the wall dashboard) turns every way, which Apple requires for iPad apps.
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Plate uses the camera to scan barcodes on food you add to your kitchen.
        NSHomeKitUsageDescription: Plate shows your lights, plugs and scenes on its home dashboard so you can switch them from there.
        NSAppleMusicUsageDescription: Plate plays the albums you pin to its home dashboard.
        NSLocationWhenInUseUsageDescription: Plate uses your location once, roughly, to show the weather on its home dashboard.
        NSCalendarsFullAccessUsageDescription: Plate shows your next few calendar events on its home dashboard.
        NSPhotoLibraryUsageDescription: Plate shows a photo album you choose on the wall dashboard when nobody's using it.
        NSSpeechRecognitionUsageDescription: Plate listens to recipe videos you give it, to write down the ingredients and method.
        CFBundleURLTypes:
          - CFBundleURLName: com.randomedp.plate
            CFBundleURLSchemes: [plate]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randomedp.plate
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad (the wall dashboard). iPad supports every orientation, as Apple requires.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PlateShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: PlateCore
    entitlements:
      path: ShareExtension/PlateShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.randomedp.plate.share]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Plate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randomedp.plate.share
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Plate:
    build:
      targets:
        Plate: all
    run:
      config: Debug
    archive:
      config: Release
