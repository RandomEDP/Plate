# Temporary: finds out which GitHub Macs and Xcode versions this repo can use, and whether the signing secrets are set.
name: Probe
on:
  push:
  workflow_dispatch:
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26, macos-15, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: What is here
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sw_vers || true
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun simctl list runtimes || true
          which xcodegen brew || true
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 ANTHROPIC_API_KEY; do
            if [ -n "${!v}" ]; then echo "$v is set"; else echo "$v is missing"; fi
          done
